# Mouse / two-finger swipe scroll (Termius iOS)
set -g mouse on

# Larger scrollback buffer
set -g history-limit 50000

# Forward modified keys (Ctrl+=, Ctrl+-, Ctrl+/) to apps as CSI-u. With the
# default (off), tmux 3.6 rewrote Ctrl+= to a plain "=" and Ctrl+-/Ctrl+/ to
# 0x1F, so janus's Ctrl+= "forward a day" never fired once janus moved into
# tmux on Ix (bug 2026-10-05). csi-u is the exact shape janus aliases
# (ESC[61;5u → F23). Legacy keys (Ctrl+C, arrows, Alt, Tab) are unchanged.
# Applies to panes created after the server reads this; restart the pane.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
