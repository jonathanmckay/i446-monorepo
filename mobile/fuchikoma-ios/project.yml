# XcodeGen spec → `xcodegen generate` writes Fuchikoma.xcodeproj (gitignored).
# Open the project in Xcode, pick your team under Signing & Capabilities,
# plug in the phone, ⌘R.
name: Fuchikoma
options:
  bundleIdPrefix: com.mckay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"            # language mode 5: the dynamic [String: Any] JSON layer is not Sendable
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # set after Apple Developer enrollment (or choose the team in Xcode once)
packages:
  FuchikomaCore:
    path: FuchikomaCore
  VaultCore:
    path: VaultCore
targets:
  Fuchikoma:
    type: application
    platform: iOS
    sources:
      - path: Fuchikoma
    dependencies:
      - package: FuchikomaCore
        product: FuchikomaCore
      - package: VaultCore
        product: VaultCore
    info:
      path: Fuchikoma/Info.plist
      properties:
        CFBundleDisplayName: Fuchikoma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Defaults are http://100.x (Tailscale IP). ATS cannot except an IP
        # literal, so plain http needs the global switch. Switch the endpoints
        # to https://ix.tail9c51d5.ts.net:8560/8561 in-app to avoid it entirely.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mckay.fuchikoma
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
