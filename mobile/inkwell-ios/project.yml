# XcodeGen spec → `xcodegen generate` writes Inkwell.xcodeproj (gitignored).
# Three app targets over one source tree (App/): dtd, janus, Inkwell.
# Each target sets one compilation condition that RootView switches on.
name: Inkwell
options:
  bundleIdPrefix: com.mckay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"            # language mode 5: the dynamic [String: Any] JSON layer is not Sendable
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L3YRH72ZW7    # Jonathan McKay (Personal Team), picked in Xcode 2026-10-19
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  InkwellCore:
    path: InkwellCore
  VaultCore:
    path: VaultCore

# Shared Info.plist keys. Defaults are http://100.x (Tailscale IP). ATS cannot
# except an IP literal, so plain http needs the global switch. Switch the
# endpoints to https://ix.tail9c51d5.ts.net:8560/8561 in-app to avoid it.
_info: &info
  CFBundleShortVersionString: $(MARKETING_VERSION)
  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  UILaunchScreen: {}
  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  UIUserInterfaceStyle: Dark
  ITSAppUsesNonExemptEncryption: false
  NSAppTransportSecurity:
    NSAllowsArbitraryLoads: true

targets:
  dtd:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Vault*.swift", "DashboardView.swift"]
      - path: Icons/dtd.xcassets
    dependencies:
      - package: InkwellCore
        product: InkwellCore
    info:
      path: App/Info-dtd.plist
      properties:
        <<: *info
        CFBundleDisplayName: dtd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mckay.dtd
        PRODUCT_NAME: dtd
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_DTD $(inherited)
  janus:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Vault*.swift", "DashboardView.swift"]
      - path: Icons/janus.xcassets
    dependencies:
      - package: InkwellCore
        product: InkwellCore
    info:
      path: App/Info-janus.plist
      properties:
        <<: *info
        CFBundleDisplayName: janus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mckay.janus
        PRODUCT_NAME: janus
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_JANUS $(inherited)
  jmdash:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Vault*.swift"]
      - path: Icons/jmdash.xcassets
    dependencies:
      - package: InkwellCore
        product: InkwellCore
    info:
      path: App/Info-jmdash.plist
      properties:
        <<: *info
        CFBundleDisplayName: JM Dash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mckay.jmdash
        PRODUCT_NAME: jmdash
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_DASH $(inherited)

  Inkwell:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["DashboardView.swift"]
      - path: Icons/inkwell.xcassets
    dependencies:
      - package: InkwellCore
        product: InkwellCore
      - package: VaultCore
        product: VaultCore
    info:
      path: App/Info-inkwell.plist
      properties:
        <<: *info
        CFBundleDisplayName: Inkwell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mckay.inkwell
        PRODUCT_NAME: Inkwell
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_INKWELL $(inherited)
